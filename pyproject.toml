[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fronttrack"
version = "0.1.0"
description = "Front tracking for the 1D Burgers equation with piecewise constant data"
requires-python = ">=3.10"
dependencies = ["numpy", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest", "hypothesis"]
docs = ["sphinx>=7", "furo", "sphinx-copybutton"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "docs", "src"]
addopts = "--doctest-modules --doctest-glob=*.rst --ignore=docs/conf.py"
